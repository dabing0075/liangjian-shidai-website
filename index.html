<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靓健时代（西安）健康科技有限公司 - 官方网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #004225 0%, #006241 30%, #00704A 60%, #00875A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        .logo-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: clamp(24px, 4vw, 36px);
            color: #fff;
            font-weight: 800;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }

        .subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        .version-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .version-card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 40px 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .version-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }

        .version-badge {
            display: inline-block;
            padding: 5px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .v1-badge {
            background: #e8f2ed;
            color: #00704A;
        }

        .v2-badge {
            background: #e3f2fd;
            color: #1565c0;
        }

        .version-card h2 {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .version-card .desc {
            font-size: 14px;
            color: #666;
            line-height: 1.7;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .version-card .arrow {
            display: inline-block;
            padding: 10px 28px;
            background: #00704A;
            color: #fff;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .version-card:hover .arrow {
            background: #006241;
        }

        .v2-card .arrow {
            background: #3498db;
        }

        .v2-card:hover .arrow {
            background: #2980b9;
        }

        .divider {
            color: rgba(255,255,255,0.6);
            margin: 16px 0;
            font-size: 14px;
        }

        @media (max-width: 560px) {
            .version-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-icon">🍃</div>
        <h1>靓健时代（西安）健康科技有限公司</h1>
        <p class="subtitle">官方网站 · 版本选择</p>
        <div class="version-cards">
            <a href="v1/index.html" class="version-card">
                <span class="version-badge v1-badge">V1</span>
                <h2>初始版</h2>
                <p class="desc">原始企业官网版本，包含企业介绍、使命愿景、主营业务、企业文化、招聘等基础板块。</p>
                <span class="arrow">查看 V1 →</span>
            </a>
            <a href="v2/index.html" class="version-card v2-card">
                <span class="version-badge v2-badge">V2</span>
                <h2>完善版</h2>
                <p class="desc">基于商业计划书完善的版本，新增核心优势、专家团队、飞轮效应、App 功能等详细板块。</p>
                <span class="arrow">查看 V2 →</span>
            </a>
        </div>
    </div>
</body>
</html>
